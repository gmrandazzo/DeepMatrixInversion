[tox]
requires =
    tox>=4.2
env_list =
    lint
    type
    py{3.11,3.12,3.13,3.14}

[testenv]
description = Run tests with {basepython}
recreate = true
package = editable
deps =
    pytest>=7.4.0
    pytest-cov>=4.1.0
commands =
    pytest tests/ -v --cov=deepmatrixinversion --cov-report=xml

[testenv:lint]
description = Run ruff linter and formatter checks
skip_install = true
deps =
    ruff>=0.5.0
commands =
    ruff format --check src tests
    ruff check src tests

[testenv:type]
description = Run mypy type checks
skip_install = true
deps =
    mypy>=1.11.0
commands =
    mypy src

[testenv:pre-commit]
description = Pre-commit
base_python = python3.11
skip_install = true
deps =
    pre-commit>=2.20
pass_env =
    HOME
    PRE_COMMIT_HOME
commands =
    pre-commit run --all-files
